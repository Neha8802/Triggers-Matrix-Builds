name: matrix build 

on: workflow_dispatch

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-slim, ubuntu-latest]
        python-version: [ "3.10", "3.11", "3.12" ]

    steps: 
      - name: setup python
        uses: actions/setup-python@v5
        with: 
          python-version: ${{ matrix.python-version }}

      - name: print the python version
        run: python --version
        
