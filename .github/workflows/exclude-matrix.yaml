name: exclude matric

on: workflow_dispatch

jobs: 
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

        exclude:
          - os: ubuntu-latest
            python-version: "3.10"


    steps:
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}

      - name: print python version
        run: python --version
          
