name: exclude matric

on: workflow_dispatch

jobs: 
  test:
    runs-on: $ {{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu slim]
        python-version: ["3.10", "3.11", "3.12"]

        exclude:
          - os: [ubuntu-lates]
            python-version: [3.10]


    steps:
      - name: setup python
        uses: action/setup-python@v5

      - name: print python version
        run: python-version
          
